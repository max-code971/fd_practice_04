<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - 04</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="image-section"></div>
        <div class="form-section">
            <div class="form-header">
                <h1>Get a Quote Now</h1>
                <p>Get a Quote Immediately Upon Form Submission</p>
            </div>

            <form class="form-main" action="/">
                <div class="form-row">
                    <input type="text" name="f-name" id="f-name" placeholder="First name" required>
                    <input type="text" name="l-name" id="l-name" placeholder="Last name" required>
                </div>

                <div class="form-row">
                    <input type="email" name="email" id="email" placeholder="Email address" required>
                    <input type="tel" name="phone" id="phone" placeholder="Phone" required>
                </div>

                <div class="form-row-full">
                    <textarea name="message" id="message" placeholder="Order details&#10;Submit Your Order Information - Item Name, Decoration Size, Quantity, Due Date and any other details"></textarea>
                </div>

                <div class="file-upload">
                    <label for="attachment" class="file-upload-label">Upload file</label>
                    <input type="file" name="attachment" id="attachment">
                </div>

                <div class="form-row-btn">
                    <button type="submit" class="submit-btn">Send Request</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
